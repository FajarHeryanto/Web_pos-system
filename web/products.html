<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk | POS Toko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="products">
  <div class="app-layout"><div id="sidebar-mount"></div><div class="main-area"><div id="topbar-mount"></div>
    <main class="page-content">
      <div class="page-heading"><div><p class="eyebrow">KATALOG & PERSEDIAAN</p><h1>Produk</h1><p class="text-muted">Kelola produk, kategori, harga, dan stok toko.</p></div><button class="btn btn-primary" id="add-product" type="button"><i class="bi bi-plus-lg me-2"></i>Tambah produk</button></div>
      <div id="product-alert"></div>
      <section class="panel table-panel">
        <div class="toolbar"><div class="search-box"><i class="bi bi-search"></i><input id="product-search" type="search" class="form-control" placeholder="Cari nama atau ID produk" aria-label="Cari produk"></div><select id="category-filter" class="form-select category-select" aria-label="Filter kategori"><option value="">Semua kategori</option></select><span class="result-count" id="product-count">Memuat…</span></div>
        <div class="table-responsive"><table class="table align-middle product-table"><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th class="text-end">Aksi</th></tr></thead><tbody id="products-body"><tr><td colspan="6" class="text-center text-muted py-5">Memuat produk…</td></tr></tbody></table></div>
        <div id="product-empty" class="empty-state d-none"><span class="empty-icon"><i class="bi bi-box-seam"></i></span><strong>Produk tidak ditemukan</strong><p>Coba ubah kata pencarian atau kategori.</p></div>
      </section>
    </main>
  </div></div>
  <div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><form id="product-form" novalidate><div class="modal-header"><div><p class="eyebrow mb-1">KATALOG PRODUK</p><h2 class="modal-title" id="product-modal-title">Tambah produk</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div><div class="modal-body"><div id="product-form-error"></div><div class="mb-3"><label class="form-label" for="form-product-id">ID produk <span class="text-muted fw-normal">(opsional)</span></label><input id="form-product-id" class="form-control" maxlength="10" placeholder="Dibuat otomatis jika kosong"></div><div class="mb-3"><label class="form-label" for="form-product-name">Nama produk</label><input id="form-product-name" class="form-control" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="form-product-category">Kategori</label><input id="form-product-category" class="form-control" maxlength="50" list="category-options" required><datalist id="category-options"></datalist></div><div class="row g-3"><div class="col-6"><label class="form-label" for="form-product-price">Harga (Rp)</label><input id="form-product-price" class="form-control" type="number" min="1" step="0.01" required></div><div class="col-6"><label class="form-label" for="form-product-stock">Stok</label><input id="form-product-stock" class="form-control" type="number" min="0" step="1" required></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button type="submit" class="btn btn-primary" id="save-product"><span class="save-label">Simpan produk</span><span class="spinner-border spinner-border-sm d-none ms-2" aria-hidden="true"></span></button></div></form></div></div></div>
  <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-modal-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="delete-modal-title">Hapus produk?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div><div class="modal-body" id="delete-product-name">Produk akan dihapus dari katalog.</div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button type="button" class="btn btn-danger" id="confirm-delete">Hapus produk</button></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/js/config.js"></script><script src="/js/api.js"></script><script src="/js/app.js"></script><script src="/js/products.js"></script>
</body></html>
